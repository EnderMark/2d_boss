name: Build & Deploy Web App (Cloudflare Pages)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Kotlin/JS Web Distribution
        run: ./gradlew :web:jsBrowserDistribution

      - name: Upload Web Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2d-boss-battle-web-dist
          path: web/build/dist/js/productionExecutable/
          retention-days: 30

      - name: Deploy to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/build/dist/js/productionExecutable --project-name=2d-boss-battle
