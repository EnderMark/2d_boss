<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>2D Boss Battle — Web Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      background: #0b0e18;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #menuScreen {
      width: 100%; height: 100%;
      overflow-y: auto;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at top, #1b2240 0%, #0b0e18 65%);
    }
    .header {
      width: 100%; max-width: 960px;
      text-align: center;
      margin-bottom: 18px;
    }
    .header h1 {
      font-size: 2rem; font-weight: 900; letter-spacing: 1px;
      background: linear-gradient(90deg, #38bdf8, #f472b6, #facc15);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header p { color: #94a3b8; font-size: 0.92rem; margin-top: 4px; }
    .audio-bar {
      width: 100%; max-width: 960px;
      display: flex; flex-wrap: wrap; gap: 12px;
      align-items: center; justify-content: center;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 10px 16px;
      margin-bottom: 18px;
    }
    .audio-bar label { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; cursor: pointer; }
    .audio-bar input[type="range"] { width: 130px; accent-color: #38bdf8; }
    .level-grid {
      width: 100%; max-width: 960px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .level-card {
      background: rgba(22, 29, 52, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
      text-align: left;
    }
    .level-card:hover {
      transform: translateY(-2px);
      border-color: #38bdf8;
      background: rgba(30, 41, 74, 0.96);
    }
    .level-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .level-title { font-size: 0.78rem; font-weight: 800; color: #38bdf8; letter-spacing: 0.6px; }
    .mode-badge {
      font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 999px;
      background: rgba(250, 204, 21, 0.16); color: #facc15; border: 1px solid rgba(250, 204, 21, 0.35);
    }
    .boss-name { font-size: 1.08rem; font-weight: 800; color: #f8fafc; margin-top: 6px; }
    .level-sub { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; line-height: 1.3; }
    .controls-hint {
      width: 100%; max-width: 960px;
      text-align: center; color: #64748b; font-size: 0.8rem; margin-top: 18px;
    }

    #gameScreen {
      display: none;
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      background: #070910;
      touch-action: none;
      user-select: none;
    }
    #gameCanvas {
      display: block;
      width: 100%; height: 100%;
      touch-action: none;
    }
    .game-topbar {
      position: fixed; top: 8px; left: 8px; right: 8px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none; z-index: 10;
    }
    .btn-mini {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.82);
      color: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.4);
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 0.82rem; font-weight: 700;
      cursor: pointer;
    }
    .btn-mini:hover { border-color: #38bdf8; }
  </style>
</head>
<body>
  <div id="menuScreen">
    <div class="header">
      <h1>2D BOSS BATTLE</h1>
      <p>Web Edition (Kotlin Multiplatform) • Giocabile su iPhone, Android, Mac e PC</p>
    </div>
    <div class="audio-bar">
      <label>Volume <input id="volSlider" type="range" min="0" max="100" value="80" /></label>
      <label><input id="musicToggle" type="checkbox" checked /> Musica</label>
      <label><input id="sfxToggle" type="checkbox" checked /> Effetti (SFX)</label>
    </div>
    <div id="levelGrid" class="level-grid"></div>
    <div class="controls-hint">
      Desktop: <b>WASD / Frecce</b> per muoverti • <b>Spazio</b> per saltare / iniziare • <b>Z / J / Invio</b> per sparare o attaccare • <b>Shift</b> scudo • <b>Esc</b> menù<br/>
      Mobile/Tablet: comandi touch direttamente su schermo!
    </div>
  </div>

  <div id="gameScreen">
    <div class="game-topbar">
      <button id="backBtn" class="btn-mini">← MENÙ</button>
      <button id="muteBtn" class="btn-mini">🔊 AUDIO</button>
    </div>
    <canvas id="gameCanvas"></canvas>
  </div>

  <script src="boss-battle.js"></script>
</body>
</html>
